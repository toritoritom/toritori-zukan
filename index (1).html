function compressImage(file,maxW=1200,quality=0.78){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const scale=Math.min(1,maxW/Math.max(img.width,img.height));
        const canvas=document.createElement("canvas");
        canvas.width=img.width*scale; canvas.height=img.height*scale;
        canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL("image/jpeg",quality));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// EXIFデータを読み取って整形
async function extractExif(file) {
  try {
    const exif = await window.exifr.parse(file);
    if (!exif) return null;
    const camera = [exif.Make, exif.Model].filter(Boolean).join(" ") || null;
    const lens   = exif.LensModel || exif.Lens || null;
    const f      = exif.FNumber ? `F${exif.FNumber}` : null;
    const ss     = exif.ExposureTime
      ? (exif.ExposureTime < 1 ? `1/${Math.round(1/exif.ExposureTime)}秒` : `${exif.ExposureTime}秒`)
      : null;
    const ev     = (exif.ExposureCompensation != null && exif.ExposureCompensation !== undefined)
      ? `${exif.ExposureCompensation > 0 ? "+" : ""}${exif.ExposureCompensation}`
      : null;
    const fl     = exif.FocalLength ? `${Math.round(exif.FocalLength)}mm` : null;
    const isoVal = exif.ISO || exif.ISOSpeedRatings || exif.PhotographicSensitivity;
    const iso    = isoVal ? `ISO${isoVal}` : null;
    // 撮影時刻
    const dto    = exif.DateTimeOriginal || exif.DateTime || null;
    let shotTime = null;
    if (dto) {
      const d = dto instanceof Date ? dto : new Date(dto);
      if (!isNaN(d)) {
        shotTime = d.toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
      }
    }
    if (!camera && !lens && !f && !ss) return null;
    return { camera, lens, f, ss, ev, fl, iso, shotTime };
  } catch(e) { console.warn("EXIF読み取り失敗:", e); return null; }
}
const R2_WORKER_URL = "https://toritori-upload.tomtomlife-11xp.workers.dev";

// オリジナル画像をCloudflare R2にアップロード
async function uploadToR2(file) {
  try {
    const formData = new FormData();
    formData.append("file", file);
    const res = await fetch(R2_WORKER_URL, { method: "POST", body: formData });
    if (!res.ok) return null;
    const data = await res.json();
    return data.url || null;
  } catch { return null; }
}

  try {
    const [lat, lon] = coords;
    const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=${date}&end_date=${date}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weather_code&hourly=wind_speed_10m&timezone=Asia%2FTokyo`;
    const res = await fetch(url);
    const data = await res.json();
    if (!data.daily) return null;
    // 日中（6〜18時）の1時間平均風速を使用 → 10分間平均風速に近い値
    const hourlyWind = data.hourly?.wind_speed_10m || [];
    const daytimeWind = hourlyWind.slice(6, 19).filter(v => v != null);
    const avgWind = daytimeWind.length > 0
      ? daytimeWind.reduce((a,b)=>a+b,0) / daytimeWind.length
      : null;
    return {
      maxTemp: data.daily.temperature_2m_max?.[0],
      minTemp: data.daily.temperature_2m_min?.[0],
      precip:  data.daily.precipitation_sum?.[0],
      wind:    avgWind,
      code:    data.daily.weather_code?.[0],
    };
  } catch { return null; }
}

function JapanMapGrid({ observedPrefs }) {
  const C=24,G=2,minCol=2,maxCol=12,minRow=1,maxRow=12;
  const W=(maxCol-minCol+3)*C, H=(maxRow-minRow+3)*C;
  const abbr=(n)=>({"北海道":"北海","神奈川県":"神奈","和歌山県":"和歌","鹿児島県":"鹿児","東京都":"東京","京都府":"京都","大阪府":"大阪"})[n]||n.slice(0,2);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{maxWidth:"320px",display:"block"}}>
      {PREF_GRID.map(p=>{
        const x=(p.col-minCol+1)*C+G, y=(p.row-minRow+1)*C+G, sz=C-G*2;
        const obs=observedPrefs.has(p.name);
        return (
          <g key={p.name}>
            <rect x={x} y={y} width={sz} height={sz} rx="2" fill={obs?"#4A6B3C":"#D8CEB0"}/>
            <text x={x+sz/2} y={y+sz/2+3.5} textAnchor="middle" fontSize="7.5"
              fontFamily="'Noto Serif JP',serif" fill={obs?"#E8DFC0":"#8A7A5A"}>{abbr(p.name)}</text>
          </g>
        );
      })}

  );
}

function JapanMap({ observedPrefs }) {
  const [mapData, setMapData] = useState(null);
  const [useFallback, setUseFallback] = useState(false);

  useEffect(()=>{
    const d3=window.d3;
    if (!d3) { setUseFallback(true); return; }
    fetch('https://cdn.jsdelivr.net/gh/dataofjapan/land@master/japan.geojson')
      .then(r=>r.json())
      .then(geo=>{
        const W=1000, H=1100;
        const proj=d3.geoMercator().fitSize([W,H],geo);
        const pg=d3.geoPath().projection(proj);

        // 実際のパス境界を計算
        let x0=W,y0=H,x1=0,y1=0;
        geo.features.forEach(f=>{
          try {
            const b=pg.bounds(f);
            if(isFinite(b[0][0])){
              x0=Math.min(x0,b[0][0]); y0=Math.min(y0,b[0][1]);
              x1=Math.max(x1,b[1][0]); y1=Math.max(y1,b[1][1]);
            }
          } catch(e){}
        });

        const pad=8;
        const vb=`${x0-pad} ${y0-pad} ${x1-x0+pad*2} ${y1-y0+pad*2}`;

        const features=geo.features.map(f=>({
          d:pg(f),
          name:f.properties?.name_local||f.properties?.nam_ja||f.properties?.nam||
               f.properties?.prefName||f.properties?.N03_001||f.properties?.name||'',
        })).filter(f=>f.d);

        if(features.length===0){setUseFallback(true);return;}
        setMapData({features, vb});
      })
      .catch(()=>setUseFallback(true));
  },[]);

  const match=(name)=>{
    if(!name) return false;
    if(observedPrefs.has(name)) return true;
    const b=name.replace(/[都道府県]$/,'');
    for(const p of observedPrefs) if(p.replace(/[都道府県]$/,'')=== b) return true;
    return false;
  };

  return (
    <div style={{padding:"12px 0 4px"}}>
      <div style={{fontSize:"10px",color:"#8A7A5A",letterSpacing:".1em",marginBottom:"4px",padding:"0 18px"}}>観察都道府県</div>
      {useFallback ? (
        <div style={{padding:"0 18px"}}><JapanMapGrid observedPrefs={observedPrefs}/></div>
      ) : !mapData ? (
        <div style={{fontSize:"11px",color:"#8A7A5A",padding:"0 18px"}}>地図を読み込み中…</div>
      ) : (
        <svg viewBox={mapData.vb} width="100%" style={{display:"block"}}>
          {mapData.features.map((f,i)=>(
            <path key={i} d={f.d}
              fill={match(f.name)?"#4A6B3C":"#D8CEB0"}
              stroke="#F5F0E8" strokeWidth="1.2"/>
          ))}
        </svg>
      )}
    </div>
  );
}

function AllObsView({ allObs, loading, totalObs, CATEGORIES, onBack, onSelectSpecies }) {
  const [filterAuthor, setFilterAuthor] = useState("");
  const [sortMode, setSortMode] = useState("count"); // count | alpha | category | recent | env | pref | season | month
  const authors = [...new Set(allObs.map(o=>o.author).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ja"));
  const filteredObs = filterAuthor ? allObs.filter(o=>o.author===filterAuthor) : allObs;
  const grouped = {};
  for (const obs of filteredObs) {
    const key = `${obs.category}__${obs.species}`;
    if (!grouped[key]) grouped[key] = { catId:obs.category, species:obs.species, count:0, hasPhoto:false, latestId:obs.id, latestCreatedAt:obs.created_at, envs:{} };
    grouped[key].count++;
    if (obs.photos?.length>0) grouped[key].hasPhoto=true;
    if (obs.created_at > grouped[key].latestCreatedAt) {
      grouped[key].latestCreatedAt = obs.created_at;
      grouped[key].latestId = obs.id;
    }
    // 観察環境・都道府県を集計
    const envPart = (obs.location||"").split("　")[1] || "";
    if (envPart) grouped[key].envs[envPart] = (grouped[key].envs[envPart]||0) + 1;
    const prefPart = (obs.location||"").split("　")[0] || "";
    if (prefPart) grouped[key].prefs = grouped[key].prefs || {};
    if (prefPart) grouped[key].prefs[prefPart] = (grouped[key].prefs?.[prefPart]||0) + 1;
    const seasonPart = obs.season || "";
    if (seasonPart) grouped[key].seasons = grouped[key].seasons || {};
    if (seasonPart) grouped[key].seasons[seasonPart] = (grouped[key].seasons?.[seasonPart]||0) + 1;
    // 月別集計（date から年月を抽出）
    const monthPart = obs.date ? obs.date.slice(0,7) : ""; // "YYYY-MM"
    if (monthPart) grouped[key].months = grouped[key].months || {};
    if (monthPart) grouped[key].months[monthPart] = (grouped[key].months?.[monthPart]||0) + 1;
  }
  // NEW判定
  const recentEntries = Object.values(grouped).sort((a,b)=>b.latestCreatedAt?.localeCompare(a.latestCreatedAt||"")||0).slice(0,5);
  const newSpeciesKeys = new Set(recentEntries.map(e=>`${e.catId}__${e.species}`));
  // 主な観察環境（最多の環境）
  const mainEnv = (e) => {
    const envs = e.envs;
    if (!envs || Object.keys(envs).length===0) return "その他";
    return Object.entries(envs).sort((a,b)=>b[1]-a[1])[0][0];
  };
  const mainPref = (e) => {
    const prefs = e.prefs;
    if (!prefs || Object.keys(prefs).length===0) return "その他";
    return Object.entries(prefs).sort((a,b)=>b[1]-a[1])[0][0];
  };
  const mainSeason = (e) => {
    const s = e.seasons;
    if (!s || Object.keys(s).length===0) return "その他";
    return Object.entries(s).sort((a,b)=>b[1]-a[1])[0][0];
  };
  const mainMonth = (e) => {
    const m = e.months;
    if (!m || Object.keys(m).length===0) return "不明";
    return Object.entries(m).sort((a,b)=>b[1]-a[1])[0][0]; // "YYYY-MM"
  };
  const fmtMonth = (ym) => { // "YYYY-MM" → "YYYY年M月"
    if (!ym || ym==="不明") return "不明";
    const [y,m] = ym.split("-");
    return `${y}年${parseInt(m)}月`;
  };
  const SEASON_ORDER = ["留鳥","漂鳥","夏鳥","冬鳥","旅鳥","迷鳥","外来種","その他"];
  const entries = Object.values(grouped).sort((a,b)=>{
    if (sortMode==="alpha")    return a.species.localeCompare(b.species,"ja");
    if (sortMode==="category") {
      const ci = (id) => CATEGORIES.findIndex(c=>c.id===id);
      return ci(a.catId)!==ci(b.catId) ? ci(a.catId)-ci(b.catId) : a.species.localeCompare(b.species,"ja");
    }
    if (sortMode==="recent")   return (b.latestCreatedAt||"").localeCompare(a.latestCreatedAt||"");
    if (sortMode==="env")      return mainEnv(a).localeCompare(mainEnv(b),"ja") || a.species.localeCompare(b.species,"ja");
    if (sortMode==="pref")     return mainPref(a).localeCompare(mainPref(b),"ja") || a.species.localeCompare(b.species,"ja");
    if (sortMode==="season") {
      const si = (e) => { const i=SEASON_ORDER.indexOf(mainSeason(e)); return i<0?99:i; };
      return si(a)!==si(b) ? si(a)-si(b) : a.species.localeCompare(b.species,"ja");
    }
    if (sortMode==="month")    return mainMonth(b).localeCompare(mainMonth(a)) || a.species.localeCompare(b.species,"ja");
    return b.count - a.count;
  });
  const catLabel = (catId) => CATEGORIES.find(c=>c.id===catId)?.label||catId;
  const btnStyle = (active) => ({
    padding:"5px 14px", borderRadius:"20px", border:"1.5px solid",
    borderColor: active?"#7A9B6A":"#C8BC9E",
    background: active?"#E8F0E4":"#FBF8F0",
    color: active?"#3A6B2A":"#6A5A3A",
    fontSize:"12px", cursor:"pointer", fontFamily:"'Noto Serif JP',serif"
  });

    padding:"4px 12px", borderRadius:"16px", border:"1.5px solid",
    borderColor: active?"#5A7A4E":"#C8BC9E",
    background: active?"#2C3B28":"#FBF8F0",
    color: active?"#E8DFC0":"#6A5A3A",
    fontSize:"11px", cursor:"pointer", fontFamily:"'Noto Serif JP',serif",
    letterSpacing:".03em"
  });
  return (
    <>
      <div className="page-hdr">
        <button className="back-btn" onClick={onBack}>← トップに戻る</button>
        <div className="page-title">観察記録一覧</div>
        <div className="page-sub">{filterAuthor ? `${filterAuthor}の記録 ${entries.length}種` : `全 ${entries.length} 種 · 種名をタップして詳細を確認`}</div>
      </div>
      {/* 記入者フィルター */}
      {authors.length > 0 && (
        <div style={{padding:"10px 18px 4px",display:"flex",gap:"8px",flexWrap:"wrap"}}>
          <button style={btnStyle(!filterAuthor)} onClick={()=>setFilterAuthor("")}>全員</button>
          {authors.map(a=>{
            const speciesCount = new Set(allObs.filter(o=>o.author===a).map(o=>`${o.category}__${o.species}`)).size;
            return (
              <button key={a} style={btnStyle(filterAuthor===a)} onClick={()=>setFilterAuthor(a)}>
                {a} <span style={{fontSize:"10px",opacity:.8}}>{speciesCount}種</span>
              </button>
            );
          })}
        </div>
      )}
      {/* 並べ替え */}
      <div style={{padding:"8px 18px 4px",display:"flex",gap:"6px",alignItems:"center",flexWrap:"wrap"}}>
        <span style={{fontSize:"10px",color:"#8A7A5A",marginRight:"2px",letterSpacing:".05em"}}>並べ替え：</span>

              CATEGORIES.map(cat=>{
                const catEntries = entries.filter(e=>e.catId===cat.id);
                if (catEntries.length===0) return null;
                return (
                  <React.Fragment key={cat.id}>
                    <div style={{padding:"8px 14px",fontSize:"12px",color:"#F5F0E8",background:"#4A6B3C",letterSpacing:".08em",marginTop:"8px",borderRadius:"6px",fontWeight:"600"}}>
                      {cat.label}　<span style={{fontWeight:"400",fontSize:"11px",opacity:.85}}>{catEntries.length}種</span>
                    </div>
                    {catEntries.map((e,i)=>{
                      const isNew = newSpeciesKeys.has(`${e.catId}__${e.species}`);
                      return (
                        <div key={i} className="sp-item" onClick={()=>onSelectSpecies(e.catId, e.species)}>
                          <span className="sp-name">{e.hasPhoto?"📷 ":""}{e.species}{isNew&&<span style={{marginLeft:"6px",fontSize:"10px",background:"#C04040",color:"#fff",padding:"1px 6px",borderRadius:"8px",letterSpacing:".05em"}}>NEW</span>}</span>
                          <span className="sp-cnt">{e.count}件</span>
                        </div>
                      );
                    })}
                  </React.Fragment>
                );
              })
            ) : sortMode==="pref" ? (
              // 都道府県別グループ表示
              (() => {
                const prefGroups = {};
                entries.forEach(e => {
                  const pref = mainPref(e);
                  if (!prefGroups[pref]) prefGroups[pref] = [];
                  prefGroups[pref].push(e);
                });
                // PREFECTURES順に並べる（登録順）
                const sortedPrefs = [...PREFECTURES, "その他"].filter(p=>prefGroups[p]);
                return sortedPrefs.map(pref=>(
                  <React.Fragment key={pref}>
                    <div style={{padding:"8px 14px",fontSize:"12px",color:"#F5F0E8",background:"#4A6B3C",letterSpacing:".08em",marginTop:"8px",borderRadius:"6px",fontWeight:"600"}}>
                      {pref}　<span style={{fontWeight:"400",fontSize:"11px",opacity:.85}}>{prefGroups[pref].length}種</span>
                    </div>
                    {prefGroups[pref].map((e,i)=>{
                      const isNew = newSpeciesKeys.has(`${e.catId}__${e.species}`);
                      return (
                        <div key={i} className="sp-item" onClick={()=>onSelectSpecies(e.catId, e.species)}>
                          <div>
                            <span className="sp-name">{e.hasPhoto?"📷 ":""}{e.species}{isNew&&<span style={{marginLeft:"6px",fontSize:"10px",background:"#C04040",color:"#fff",padding:"1px 6px",borderRadius:"8px",letterSpacing:".05em"}}>NEW</span>}</span>
                            <div style={{fontSize:"10px",color:"#8A7A5A",marginTop:"2px"}}>{catLabel(e.catId)}</div>
                          </div>
                          <span className="sp-cnt">{e.count}件</span>
                        </div>
                      );
                    })}
                  </React.Fragment>
                ));
              })()
            ) : sortMode==="season" ? (
              (() => {
                const seasonGroups = {};
                entries.forEach(e => {
                  const s = mainSeason(e);
                  if (!seasonGroups[s]) seasonGroups[s] = [];
                  seasonGroups[s].push(e);
                });
                return SEASON_ORDER.filter(s=>seasonGroups[s]).map(season=>(
                  <React.Fragment key={season}>
                    <div style={{padding:"8px 14px",fontSize:"12px",color:"#F5F0E8",background:"#4A6B3C",letterSpacing:".08em",marginTop:"8px",borderRadius:"6px",fontWeight:"600"}}>
                      {season}　<span style={{fontWeight:"400",fontSize:"11px",opacity:.85}}>{seasonGroups[season].length}種</span>
                    </div>
                    {seasonGroups[season].map((e,i)=>{
                      const isNew = newSpeciesKeys.has(`${e.catId}__${e.species}`);
                      return (
                        <div key={i} className="sp-item" onClick={()=>onSelectSpecies(e.catId, e.species)}>
                          <div>
                            <span className="sp-name">{e.hasPhoto?"📷 ":""}{e.species}{isNew&&<span style={{marginLeft:"6px",fontSize:"10px",background:"#C04040",color:"#fff",padding:"1px 6px",borderRadius:"8px",letterSpacing:".05em"}}>NEW</span>}</span>
                            <div style={{fontSize:"10px",color:"#8A7A5A",marginTop:"2px"}}>{catLabel(e.catId)}</div>
                          </div>
                          <span className="sp-cnt">{e.count}件</span>
                        </div>
                      );
                    })}
                  </React.Fragment>
                ));
              })()
            ) : sortMode==="month" ? (
              (() => {
                // 月ごとに「その月に観察された種」を収集
                const monthGroups = {};
                filteredObs.forEach(obs => {
                  const ym = obs.date ? obs.date.slice(0,7) : null;
                  if (!ym) return;
                  if (!monthGroups[ym]) monthGroups[ym] = {};
                  const key = `${obs.category}__${obs.species}`;
                  if (!monthGroups[ym][key]) monthGroups[ym][key] = {
                    catId: obs.category, species: obs.species,
                    count: 0, hasPhoto: false,
                  };
                  monthGroups[ym][key].count++;
                  if (obs.photos?.length>0) monthGroups[ym][key].hasPhoto = true;
                });
                const sortedMonths = Object.keys(monthGroups).sort((a,b)=>b.localeCompare(a));
                return sortedMonths.map(ym=>{
                  const speciesList = Object.values(monthGroups[ym]).sort((a,b)=>a.species.localeCompare(b.species,"ja"));
                  return (
                    <React.Fragment key={ym}>
                      <div style={{padding:"8px 14px",fontSize:"12px",color:"#F5F0E8",background:"#4A6B3C",letterSpacing:".08em",marginTop:"8px",borderRadius:"6px",fontWeight:"600"}}>
                        {fmtMonth(ym)}　<span style={{fontWeight:"400",fontSize:"11px",opacity:.85}}>{speciesList.length}種</span>
                      </div>
                      {speciesList.map((e,i)=>{
                        const isNew = newSpeciesKeys.has(`${e.catId}__${e.species}`);
                        return (
                          <div key={i} className="sp-item" onClick={()=>onSelectSpecies(e.catId, e.species)}>
                            <div>
                              <span className="sp-name">{e.hasPhoto?"📷 ":""}{e.species}{isNew&&<span style={{marginLeft:"6px",fontSize:"10px",background:"#C04040",color:"#fff",padding:"1px 6px",borderRadius:"8px",letterSpacing:".05em"}}>NEW</span>}</span>
                              <div style={{fontSize:"10px",color:"#8A7A5A",marginTop:"2px"}}>{catLabel(e.catId)}</div>
                            </div>
                            <span className="sp-cnt">{e.count}件</span>
                          </div>
                        );
                      })}
                    </React.Fragment>
                  );
                });
              })()
            ) : sortMode==="env" ? (
              // 観察環境別グループ表示
              (() => {
                const envGroups = {};
                entries.forEach(e => {
                  const env = mainEnv(e);
                  if (!envGroups[env]) envGroups[env] = [];
                  envGroups[env].push(e);
                });
                return Object.entries(envGroups).sort(([a],[b])=>a.localeCompare(b,"ja")).map(([env, grpEntries])=>(
                  <React.Fragment key={env}>
                    <div style={{padding:"8px 14px",fontSize:"12px",color:"#F5F0E8",background:"#4A6B3C",letterSpacing:".08em",marginTop:"8px",borderRadius:"6px",fontWeight:"600"}}>
                      {env}　<span style={{fontWeight:"400",fontSize:"11px",opacity:.85}}>{grpEntries.length}種</span>
                    </div>
                    {grpEntries.map((e,i)=>{
                      const isNew = newSpeciesKeys.has(`${e.catId}__${e.species}`);
                      return (
                        <div key={i} className="sp-item" onClick={()=>onSelectSpecies(e.catId, e.species)}>
                          <div>
                            <span className="sp-name">{e.hasPhoto?"📷 ":""}{e.species}{isNew&&<span style={{marginLeft:"6px",fontSize:"10px",background:"#C04040",color:"#fff",padding:"1px 6px",borderRadius:"8px",letterSpacing:".05em"}}>NEW</span>}</span>
                            <div style={{fontSize:"10px",color:"#8A7A5A",marginTop:"2px"}}>{catLabel(e.catId)}</div>
                          </div>
                          <span className="sp-cnt">{e.count}件</span>
                        </div>
                      );
                    })}
                  </React.Fragment>
                ));
              })()
            ) : (
              entries.map((e,i)=>{
                const isNew = newSpeciesKeys.has(`${e.catId}__${e.species}`);
                return (
                  <div key={i} className="sp-item" onClick={()=>onSelectSpecies(e.catId, e.species)}>
                    <div>
                      <span className="sp-name">{e.hasPhoto?"📷 ":""}{e.species}{isNew&&<span style={{marginLeft:"6px",fontSize:"10px",background:"#C04040",color:"#fff",padding:"1px 6px",borderRadius:"8px",letterSpacing:".05em"}}>NEW</span>}</span>
                      <div style={{fontSize:"10px",color:"#8A7A5A",marginTop:"2px"}}>{catLabel(e.catId)}</div>
                    </div>
                    <span className="sp-cnt">{e.count}件</span>
                  </div>
                );
              })
            )}
          </div>
        )
      }
    </>
  );
}

function App(){
  const [allObs, setAllObs]           = useState([]);
  const [loading, setLoading]         = useState(true);
  const [dbError, setDbError]         = useState(null);
  const [view, setView]               = useState("home");
  const [activeCategory, setActiveCategory] = useState(null);
  const [activeSpecies, setActiveSpecies]   = useState(null);
  const [showForm, setShowForm]       = useState(false);
  const [search, setSearch]           = useState("");
  const [searchResults, setSearchResults] = useState([]);
  const [form, setForm]               = useState({season:"留鳥",location:"",prefecture:"",environment:"",date:"",memo:"",author: localStorage.getItem("toritori_username") || ""});
  const [photos, setPhotos]           = useState([]);
  const [dragging, setDragging]       = useState(false);
  const [submitted, setSubmitted]     = useState(false);
  const [uploading, setUploading]     = useState(false);
  const [saving, setSaving]           = useState(false);
  const [editingObs, setEditingObs]   = useState(null);
  const [lightbox, setLightbox]       = useState(null);
  const [isAdmin, setIsAdmin]         = useState(false);
  const [showAdminLogin, setShowAdminLogin] = useState(false);
  const [adminPwInput, setAdminPwInput]     = useState("");
  const [adminPwError, setAdminPwError]     = useState(false);
  const [currentUserName, setCurrentUserName] = useState(()=> localStorage.getItem("toritori_username") || "");
  // アクセスパスワード
  const [isLoggedIn, setIsLoggedIn]         = useState(false);
  const [accessPw, setAccessPw]             = useState("");
  const [accessPwInput, setAccessPwInput]   = useState("");
  const [accessPwError, setAccessPwError]   = useState(false);
  const [accessPwLoading, setAccessPwLoading] = useState(true);
  // 管理者：パスワード変更
  const [showPwChange, setShowPwChange]     = useState(false);
  const [newPwInput, setNewPwInput]         = useState("");
  const [pwChangeMsg, setPwChangeMsg]       = useState("");
  const fileInputRef = useRef(null);

  // アクセスパスワードをDBから取得
  useEffect(()=>{
    (async()=>{
      const { data } = await supabase.from("config").select("value").eq("key","access_password").single();
      if (data) setAccessPw(data.value);
      setAccessPwLoading(false);
    })();
  },[]);

  const handleAccessLogin = () => {
    if (accessPwInput === accessPw) {
      setIsLoggedIn(true); setAccessPwError(false);
    } else {
      setAccessPwError(true);
    }
  };

  const handlePwChange = async () => {
    if (!newPwInput.trim()) return;
    const { error } = await supabase.from("config").update({ value: newPwInput }).eq("key","access_password");
    if (error) { setPwChangeMsg("❌ 変更に失敗しました"); return; }
    setAccessPw(newPwInput);
    setNewPwInput("");
    setPwChangeMsg("✅ パスワードを変更しました");
    setTimeout(()=>{ setPwChangeMsg(""); setShowPwChange(false); },2000);
  };

  // DB から全記録を取得（写真除外で高速化）
  const fetchObs = async () => {
    setLoading(true);
    const { data, error } = await supabase
      .from("observations")
      .select("id,category,species,season,location,date,memo,author,created_at,pinned,stamps,stamp_users")
      .order("created_at", { ascending: false });
    if (error) { setDbError(error.message); }
    else { setAllObs(data || []); }
    setLoading(false);
  };

  useEffect(()=>{ fetchObs(); },[]);

  // リアルタイム購読（他の人の投稿が即反映）
  useEffect(()=>{
    const channel = supabase
      .channel("observations_realtime")
      .on("postgres_changes",{ event:"INSERT", schema:"public", table:"observations" },
        payload => {
          const { photos: _, ...obsWithoutPhotos } = payload.new;
          setAllObs(prev => prev.some(o => o.id === payload.new.id) ? prev : [obsWithoutPhotos, ...prev]);
          // 現在表示中の種なら写真込みで追加
          if (payload.new.category === activeCategory && payload.new.species === activeSpecies) {
            setSpeciesObs(prev => prev.some(o=>o.id===payload.new.id) ? prev : [payload.new, ...prev]);
          }
        })
      .subscribe();
    return ()=>{ supabase.removeChannel(channel); };
  },[activeCategory, activeSpecies]);

  const obsFor = (catId, sp) => {
    const list = speciesObs.length > 0 ? speciesObs : allObs.filter(o => o.category===catId && o.species===sp);
    return [...list.filter(o=>o.pinned), ...list.filter(o=>!o.pinned)];
  };

  // 種を選んだとき写真込みで取得
  const [speciesObs, setSpeciesObs] = useState([]);
  const [loadingSpecies, setLoadingSpecies] = useState(false);
  const [speciesInfo, setSpeciesInfo] = useState(null);

  useEffect(()=>{
    if (!activeCategory || !activeSpecies) { setSpeciesObs([]); setSpeciesInfo(null); return; }
    setLoadingSpecies(true);
    setSpeciesInfo(null);

    // 環境省第5次レッドリスト（鳥類）全170種 完全版

      "マミジロクイナ":"EX","ハシブトゴイ":"EX","ダイトウノスリ":"EX",
      "ミヤコショウビン":"EX","キタタキ":"EX","シマハヤブサ":"EX",
      "ダイトウヤマガラ":"EX","ムコジマメグロ":"EX","ダイトウミソサザイ":"EX",
      "オガサワラガビチョウ":"EX","オガサワラマシコ":"EX",
      // 絶滅危惧IA類 CR
      "サカツラガン":"CR","アカハジロ":"CR","アカガシラカラスバト":"CR",
      "ヤンバルクイナ":"CR","ヘラシギ":"CR","アカアシシギ":"CR",
      "カラフトアオアシシギ":"CR","ウミガラス":"CR","ウミスズメ":"CR",
      "エトピリカ":"CR","クロコシジロウミツバメ":"CR","オガサワラヒメミズナギドリ":"CR",
      "オガサワラミズナギドリ":"CR","チシマウガラス":"CR","サンカノゴイ":"CR",
      "オオヨシゴイ":"CR","カンムリワシ":"CR","ダイトウコノハズク":"CR",
      "ワシミミズク":"CR","アカモズ":"CR","コトラツグミ":"CR",
      "オガサワラカワラヒワ":"CR","シマアオジ":"CR",
      // 絶滅危惧IB類 EN
      "カリガネ":"EN","ライチョウ":"EN","ヨナグニカラスバト":"EN",
      "シマクイナ":"EN","オオクイナ":"EN","コシャクシギ":"EN",
      "ツルシギ":"EN","オオセグロカモメ":"EN","オオアジサシ":"EN",
      "コアジサシ":"EN","ケイマフリ":"EN","コアホウドリ":"EN",
      "コシジロウミツバメ":"EN","オーストンウミツバメ":"EN","コウノトリ":"EN",
      "ヒメウ":"EN","トキ":"EN","ヘラサギ":"EN","アマサギ":"EN",
      "クマタカ":"EN","イヌワシ":"EN","チュウヒ":"EN","オガサワラノスリ":"EN",
      "シマフクロウ":"EN","ブッポウソウ":"EN","オリイコゲラ":"EN",
      "ノグチゲラ":"EN","チゴモズ":"EN","ナミエヤマガラ":"EN",
      "オーストンヤマガラ":"EN","オリイヤマガラ":"EN","ダイトウウグイス":"EN",
      "イイジマムシクイ":"EN","オオムシクイ":"EN","オオセッカ":"EN",
      "モスケミソサザイ":"EN","アカコッコ":"EN","カシラダカ":"EN","コジュリン":"EN",
      // 絶滅危惧II類 VU
      "コクガン":"VU","シジュウカラガン":"VU","ハクガン":"VU","キンクロハジロ":"VU",
      "ウズラ":"VU","ハリオアマツバメ":"VU","アマツバメ":"VU","バン":"VU",
      "マナヅル":"VU","ナベヅル":"VU","ムナグロ":"VU","シロチドリ":"VU",
      "ホウロクシギ":"VU","オオソリハシシギ":"VU","ハマシギ":"VU","タカブシギ":"VU",
      "ツバメチドリ":"VU","ズグロカモメ":"VU","ウミネコ":"VU",
      "ベニアジサシ":"VU","エリグロアジサシ":"VU","カンムリウミスズメ":"VU",
      "アカオネッタイチョウ":"VU","アホウドリ":"VU","ヒメクロウミツバメ":"VU",
      "クロウミツバメ":"VU","シロハラミズナギドリ":"VU","アオツラカツオドリ":"VU",
      "アカアシカツオドリ":"VU","クロツラヘラサギ":"VU","ズグロミゾゴイ":"VU",
      "ゴイサギ":"VU","ササゴイ":"VU","コサギ":"VU",
      "オオワシ":"VU","オジロワシ":"VU","サシバ":"VU","ヤマセミ":"VU",
      "オーストンオオアカゲラ":"VU","ハシブトヒヨドリ":"VU",
      "ウチヤマセンニュウ":"VU","マキノセンニュウ":"VU","ハハジマメグロ":"VU",
      "タネコマドリ":"VU","ホントウアカヒゲ":"VU","リュウキュウキビタキ":"VU",
      // 準絶滅危惧 NT
      "オオヒシクイ":"NT","ヒシクイ":"NT","ホシハジロ":"NT","スズガモ":"NT",
      "エゾライチョウ":"NT","アカヤマドリ":"NT","コシジロヤマドリ":"NT",
      "ヨタカ":"NT","キタアマツバメ":"NT","カラスバト":"NT","ヒクイナ":"NT",
      "タンチョウ":"NT","キョウジョシギ":"NT","トウネン":"NT",
      "アマミヤマシギ":"NT","オオジシギ":"NT","クロアシアホウドリ":"NT",
      "ミゾゴイ":"NT","チュウサギ":"NT","ハイタカ":"NT","オオタカ":"NT",
      "クマゲラ":"NT","ハヤブサ":"NT","オナガ":"NT","ダイトウヒヨドリ":"NT",
      "コヨシキリ":"NT","ダイトウメジロ":"NT","オオトラツグミ":"NT",
      "ビンズイ":"NT","ノジコ":"NT",
      // 情報不足 DD
      "ツクシガモ":"DD","トモエガモ":"DD","キンバト":"DD","ヒメクイナ":"DD",
      "ダイトウカイツブリ":"DD","セイタカシギ":"DD","ケリ":"DD","タマシギ":"DD",
      "マダラウミスズメ":"DD","ヨシゴイ":"DD","ハチクマ":"DD","リュウキュウツミ":"DD",
      "キンメフクロウ":"DD","リュウキュウオオコノハズク":"DD","ミユビゲラ":"DD",
      "ヤイロチョウ":"DD","アカヒゲ":"DD","ギンザンマシコ":"DD",
    };

    const STATUS_JP = {
      'EX':'絶滅','EW':'野生絶滅','CR':'絶滅危惧IA類',
      'EN':'絶滅危惧IB類','VU':'絶滅危惧II類','NT':'準絶滅危惧',
      'LC':'軽度懸念','DD':'情報不足',
    };

    const moeCode = MOE_RL[activeSpecies] || null;

    // iNaturalistから学名・分類情報を取得
    fetch(`https://api.inaturalist.org/v1/taxa/autocomplete?q=${encodeURIComponent(activeSpecies)}&locale=ja&per_page=5`)
      .then(r=>r.json())
      .then(async data=>{
        const birds=(data.results||[]).filter(t=>t.iconic_taxon_name==="Aves"||(t.ancestor_ids||[]).includes(3));
        const t=birds[0]||data.results?.[0];
        let order=null, family=null, genus=null, authorship=null;
        if (t?.id) {
          try {
            const det = await fetch(`https://api.inaturalist.org/v1/taxa/${t.id}?locale=ja`).then(r=>r.json());
            const taxon = det.results?.[0];
            const anc = taxon?.ancestors || [];
            const orderT  = anc.find(a=>a.rank==="order");
            const familyT = anc.find(a=>a.rank==="family");
            const genusT  = anc.find(a=>a.rank==="genus");
            order  = orderT?.preferred_common_name  || orderT?.name  || null;
            family = familyT?.preferred_common_name || familyT?.name || null;
            // 属：日本語名があればそれ＋属、なければラテン名＋属
            const genusJa  = genusT?.preferred_common_name;
            const genusLat = genusT?.name;
            genus = genusJa ? (genusJa.endsWith("属") ? genusJa : genusJa + "属") : (genusLat ? genusLat + "属" : null);
            // 命名者・年：name_with_authorshipから抽出
            const nwa = taxon?.name_with_authorship || "";
            const sciName = t?.name || "";
            let authStr = nwa.startsWith(sciName) ? nwa.slice(sciName.length).trim() : "";
            if (authStr.startsWith("(") && authStr.endsWith(")")) authStr = authStr.slice(1,-1).trim();
            authorship = authStr || null;
          } catch(e){}
        }
        setSpeciesInfo({
          scientific: t?.name||null,
          order, family, genus, authorship,
          status: moeCode,
          statusJa: moeCode ? STATUS_JP[moeCode] : null,
          source: moeCode ? "環境省RL2020" : null,
        });
      })
      .catch(()=>{
        setSpeciesInfo({
          scientific: null,
          order: null, family: null, genus: null, authorship: null,
          status: moeCode,
          statusJa: moeCode ? STATUS_JP[moeCode] : null,
          source: moeCode ? "環境省RL2020" : null,
        });
      });
    supabase
      .from("observations")
      .select("*")
      .eq("category", activeCategory)
      .eq("species", activeSpecies)
      .order("created_at", { ascending: false })
      .then(async ({ data }) => {
        const obs = data || [];
        setSpeciesObs(obs);
        setLoadingSpecies(false);
        // weather未取得の投稿があれば自動取得してDBに保存
        const missing = obs.filter(o => !o.weather && o.date && o.location);
        for (const o of missing) {
          const pref = (o.location||"").split("　")[0];
          if (!PREFECTURES.includes(pref)) continue;
          const w = await fetchWeather(o.date, pref).catch(()=>null);
          if (!w) continue;
          await supabase.from("observations").update({ weather: w }).eq("id", o.id);
          setSpeciesObs(prev => prev.map(x => x.id===o.id ? {...x, weather:w} : x));
        }

            )}
            {activeSpecies && (
              <button className="post-btn" onClick={()=>setShowForm(true)}>＋ 観察記録を追加</button>
            )}
          </div>
        </div>

        {/* HOME */}
        {view==="home" && (
          <>
            <div className="hero">
              <div className="hero-lbl">COMMUNITY WILD BIRD LIFE LIST</div>
              <div className="hero-title">ToriTori<br/>野鳥ライフリスト</div>
              <div style={{fontSize:"13px",color:"#C8E0B8",marginTop:"8px",letterSpacing:".1em"}}>みんなで作る野鳥の記録</div>
              <div className="hero-stats">
                <div><div className="stat-num">{totalSpecies}</div><div className="stat-lbl">掲載種数</div></div>
                <div><div className="stat-num">{CATEGORIES.length}</div><div className="stat-lbl">目（もく）</div></div>
                <div style={{cursor:"pointer"}} onClick={()=>setView("allobs")}>
                  <div className="stat-num" style={{textDecoration:"underline",textUnderlineOffset:"3px"}}>
                    {loading?"…":new Set(allObs.map(o=>`${o.category}__${o.species}`)).size}
                  </div>
                  <div className="stat-lbl">観察種数 ▶</div>
                </div>
              </div>
            </div>
            {dbError && <div className="db-error">⚠️ データベース接続エラー：{dbError}</div>}
            <div className="search-wrap">
              <input className="search-input" placeholder="🔍  種名で検索（例：メジロ、オオタカ…）" value={search} onChange={e=>handleSearch(e.target.value)} />
            </div>
            {search ? (
              <div className="search-results">
                {searchResults.length===0
                  ? <div style={{padding:"14px",color:"#8A7A5A",fontSize:"13px"}}>「{search}」に一致する種が見つかりません</div>
                  : searchResults.map((r,i)=>(
                    <div key={i} className="sr-item" onClick={()=>{ setActiveCategory(r.catId); setActiveSpecies(r.name); setView("species"); setSearch(""); setSearchResults([]); }}>
                      <span className="sr-name">{r.name}</span><span className="sr-cat">{r.catLabel}</span>
                    </div>
                  ))}
              </div>
            ) : (
              <div className="cat-grid">
                {CATEGORIES.map(c=>(
                  <div key={c.id} className="cat-card" onClick={()=>{ setActiveCategory(c.id); setView("category"); }}>
                    <div className="cat-name">{c.label}</div>
                    <div className="cat-count">{SPECIES_LIST[c.id]?.length||0}種{countByCat(c.id)>0?` · ${new Set(allObs.filter(o=>o.category===c.id).map(o=>o.species)).size}種の記録`:""}</div>
                    <div className="cat-bar" style={{background:c.color}}/>
                  </div>
                ))}
              </div>
            )}
          </>
        )}

        {/* ALL OBSERVATIONS */}
        {view==="allobs" && (
          <AllObsView
            allObs={allObs}
            loading={loading}
            totalObs={totalObs}
            CATEGORIES={CATEGORIES}
            onBack={()=>setView("home")}
            onSelectSpecies={(catId,sp)=>{ setActiveCategory(catId); setActiveSpecies(sp); setView("species"); }}
          />
        )}

        {/* CATEGORY */}
        {view==="category" && cat && (
          <>
            <div className="page-hdr">
              <button className="back-btn" onClick={()=>{ setView("home"); setActiveCategory(null); }}>← 一覧に戻る</button>
              <div className="page-title">{cat.label}</div>
              <div className="page-sub">{speciesList.length}種掲載 · 種名をタップして観察記録を確認・追加</div>
            </div>
            <div className="sp-list">
              {[...speciesList].sort((a,b)=>a.localeCompare(b,"ja")).map(sp=>{
                const obs=obsFor(cat.id,sp);
                const hasPhoto=obs.some(o=>o.photos?.length>0);
                return(
                  <div key={sp} className="sp-item" onClick={()=>{ setActiveSpecies(sp); setView("species"); }}>
                    <span className="sp-name">{hasPhoto?"📷 ":""}{sp}</span>
                    {obs.length>0?<span className="sp-cnt">{obs.length}件</span>:<span className="sp-none">記録なし</span>}
                  </div>
                );
              })}
            </div>
          </>
        )}

        {/* SPECIES */}
        {view==="species" && activeSpecies && (
          <>
            <div className="sp-detail-hdr">
              <button className="back-btn" onClick={()=>{ setView("category"); setActiveSpecies(null); }}>← {cat?.label}に戻る</button>
              <div className="sp-detail-name">{activeSpecies}</div>
              <div style={{display:"flex",alignItems:"center",gap:"8px",flexWrap:"wrap",marginTop:"4px",marginBottom:"12px"}}>
                {speciesInfo?.status && (
                  <span style={{
                    fontSize:"11px",fontWeight:"600",letterSpacing:".05em",
                    padding:"2px 10px",borderRadius:"4px",
                    ...({
                      'LC':{background:"#E8F0E4",color:"#3A6B2A"},
                      'NT':{background:"#F0F0E0",color:"#5A6A20"},
                      'VU':{background:"#F5EAD0",color:"#8A6020"},
                      'EN':{background:"#F5E0D0",color:"#C06020"},
                      'CR':{background:"#F5D8D8",color:"#C04040"},
                      'EW':{background:"#D8D8D8",color:"#2A2A2A"},
                      'EX':{background:"#2A2A2A",color:"#F0F0F0"},
                      'DD':{background:"#E8E8E8",color:"#6A6A6A"},
                    }[speciesInfo.status]||{background:"#E8E8E8",color:"#6A6A6A"})
                  }}>
                    {speciesInfo.status}{speciesInfo.statusJa ? `（${speciesInfo.statusJa}）` : ""}
                    {speciesInfo.source && <span style={{fontWeight:"400",opacity:.7,marginLeft:"4px",fontSize:"10px"}}>/{speciesInfo.source}</span>}
                  </span>
                )}
              </div>
              {/* 分類情報テーブル */}
              {((speciesInfo && (speciesInfo.scientific || speciesInfo.order || speciesInfo.family || speciesInfo.genus)) || BIRD_DATA[activeSpecies]) ? (
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:"13px",color:"#3C3028",marginBottom:"4px",background:"#FAFAF7",borderRadius:"6px",overflow:"hidden",border:"1px solid #E0D8C8"}}>
                  <tbody>
                    {BIRD_DATA[activeSpecies]?.kanji && (
                      <tr style={{borderBottom:"1px solid #E8E0D0"}}>
                        <td style={{padding:"7px 12px",color:"#8A7A5A",fontWeight:"500",whiteSpace:"nowrap",width:"6em",background:"#F5F0E8"}}>和名（漢字）</td>
                        <td style={{padding:"7px 12px"}}>{BIRD_DATA[activeSpecies].kanji}</td>
                      </tr>
                    )}
                    {speciesInfo?.scientific && (
                      <tr style={{borderBottom:"1px solid #E8E0D0"}}>
                        <td style={{padding:"7px 12px",color:"#8A7A5A",fontWeight:"500",whiteSpace:"nowrap",width:"6em",background:"#F5F0E8"}}>学名</td>
                        <td style={{padding:"7px 12px",fontStyle:"italic"}}>{speciesInfo.scientific}</td>
                      </tr>
                    )}
                    {BIRD_DATA[activeSpecies]?.reading && (
                      <tr style={{borderBottom:"1px solid #E8E0D0"}}>
                        <td style={{padding:"7px 12px",color:"#8A7A5A",fontWeight:"500",whiteSpace:"nowrap",width:"6em",background:"#F5F0E8"}}>学名の読み</td>
                        <td style={{padding:"7px 12px"}}>{BIRD_DATA[activeSpecies].reading}</td>
                      </tr>
                    )}
                    {speciesInfo?.authorship && (
                      <tr style={{borderBottom:"1px solid #E8E0D0"}}>
                        <td style={{padding:"7px 12px",color:"#8A7A5A",fontWeight:"500",whiteSpace:"nowrap",width:"6em",background:"#F5F0E8"}}>命名者・年</td>
                        <td style={{padding:"7px 12px"}}>{speciesInfo.authorship}</td>
                      </tr>
                    )}
                    {speciesInfo?.order && (
                      <tr style={{borderBottom:"1px solid #E8E0D0"}}>
                        <td style={{padding:"7px 12px",color:"#8A7A5A",fontWeight:"500",whiteSpace:"nowrap",width:"6em",background:"#F5F0E8"}}>目</td>
                        <td style={{padding:"7px 12px"}}>{speciesInfo.order}</td>
                      </tr>
                    )}
                    {speciesInfo?.family && (
                      <tr style={{borderBottom:"1px solid #E8E0D0"}}>
                        <td style={{padding:"7px 12px",color:"#8A7A5A",fontWeight:"500",whiteSpace:"nowrap",width:"6em",background:"#F5F0E8"}}>科</td>
                        <td style={{padding:"7px 12px"}}>{speciesInfo.family}</td>
                      </tr>
                    )}
                    {speciesInfo?.genus && (
                      <tr style={{borderBottom: BIRD_DATA[activeSpecies]?.length ? "1px solid #E8E0D0" : "none"}}>
                        <td style={{padding:"7px 12px",color:"#8A7A5A",fontWeight:"500",whiteSpace:"nowrap",width:"6em",background:"#F5F0E8"}}>属</td>
                        <td style={{padding:"7px 12px"}}>{speciesInfo.genus}</td>
                      </tr>
                    )}
                    {BIRD_DATA[activeSpecies]?.length && (
                      <tr>
                        <td style={{padding:"7px 12px",color:"#8A7A5A",fontWeight:"500",whiteSpace:"nowrap",width:"6em",background:"#F5F0E8"}}>全長</td>
                        <td style={{padding:"7px 12px"}}>{BIRD_DATA[activeSpecies].length}</td>
                      </tr>
                    )}
                  </tbody>
                </table>
              ) : null}
              {!speciesInfo && (
                <div style={{fontSize:"12px",color:"#B0A890",padding:"8px 0"}}>分類情報を読み込み中…</div>
              )}
            </div>
            {(() => {
              const speciesObs = obsFor(activeCategory, activeSpecies);
              const observedPrefs = new Set(
                speciesObs.map(o => {
                  const parts = (o.location||"").split("　");
                  return PREFECTURES.find(p => p === parts[0]) || null;
                }).filter(Boolean)
              );
              return observedPrefs.size > 0 ? <JapanMap observedPrefs={observedPrefs} /> : null;
            })()}
            <div className="obs-wrap">
              <button className="add-btn" onClick={()=>setShowForm(true)}>＋ 観察記録を追加する</button>
              {loading ? <div className="loading">読み込み中…</div>
              : obsFor(activeCategory,activeSpecies).length===0
                ? <div className="empty">まだ観察記録がありません。<br/>最初の記録を追加してみましょう！</div>
                : obsFor(activeCategory,activeSpecies).map(obs=>{
                  const myStamp = (obs.stamp_users||[]).includes(currentUserName);
                  return (
                  <div key={obs.id} className={`obs-card${obs.pinned?" pinned":""}`}>
                    {obs.pinned && <span className="pin-badge">📌 固定</span>}
                    <span className="obs-season">{obs.season}</span>
                    <div className="obs-meta" style={{display:"flex",alignItems:"center",gap:"10px",flexWrap:"wrap"}}>
                      <span style={{display:"flex",alignItems:"center",gap:"3px"}}><IcPin size={12} stroke="#8A7A5A"/>{obs.location}</span>
                      <span style={{display:"flex",alignItems:"center",gap:"3px"}}><IcCal size={12} stroke="#8A7A5A" fill="none"/>{obs.date}</span>
                      {obs.author && <span style={{display:"flex",alignItems:"center",gap:"3px"}}><IcPen size={11} stroke="#8A7A5A"/>{obs.author}</span>}
                    </div>
                    {obs.photos?.length>0 && (
                      <div className="obs-photos">
                        {obs.photos.map((p,pi)=>{
                          const thumbSrc = typeof p==="object" ? p.thumb : p;
                          return (
                            <img key={pi} className="obs-thumb" src={thumbSrc} alt={`写真${pi+1}`}
                              onClick={()=>setLightbox({allPhotos:obs.photos,index:pi,obs})}/>
                          );
                        })}
                      </div>
                    )}
                    {obs.memo && <div className="obs-memo" style={{whiteSpace:"pre-wrap"}}>{obs.memo}</div>}
                    <WeatherWidget weather={obs.weather} />
                    <div className="obs-footer">
                      <button className={`stamp-btn${myStamp?" stamped":""}`} onClick={()=>handleStamp(obs)}>
                        👀 {myStamp ? "見た！" : "見た"}{(obs.stamps||0)>0 && <span style={{fontWeight:"600"}}>{obs.stamps}</span>}
                      </button>
                      {(isAdmin || (currentUserName && obs.author === currentUserName)) && (
                        <div className="obs-actions">
                          {isAdmin && (
                            <button className="obs-edit-btn" style={{background:obs.pinned?"#D8EDD0":"none",borderColor:obs.pinned?"#7A9B6A":"#C8BC9E",color:obs.pinned?"#3A6B2A":"#6A5A3A"}} onClick={()=>handlePin(obs)}>
                              {obs.pinned ? "📌 固定中" : "📌 固定"}
                            </button>
                          )}
                          <button className="obs-edit-btn" onClick={()=>openEdit(obs)}>✏️ 編集</button>
                          <button className="obs-del-btn" onClick={()=>handleDelete(obs)}>🗑️ 削除</button>
                        </div>
                      )}
                    </div>
                  </div>
                  );
                })
              }
            </div>
          </>
        )}
      </div>}

      {/* 投稿フォーム */}
      {isLoggedIn && showForm && (activeSpecies || editingObs) && (
        <div className="overlay" onClick={e=>{ if(e.target.className==="overlay"){setShowForm(false);setPhotos([]);setEditingObs(null);} }}>
          <div className="sheet">
            <div className="handle"/>
            {submitted ? <div className="success">{editingObs ? "✅ 記録を更新しました！" : "✅ 記録が追加されました！"}</div> : (
              <>
                <div className="form-title">{editingObs ? "観察記録を編集" : "観察記録を追加"}</div>
                <div className="form-sub">種名：{activeSpecies||editingObs?.species}（{cat?.label}）</div>
                <div className="frow">
                  <div className="fg">
                    <label className="fl">渡り区分</label>
                    <select className="fs" value={form.season} onChange={e=>setForm({...form,season:e.target.value})}>
                      {SEASON_TAGS.map(s=><option key={s} value={s}>{s}</option>)}
                    </select>
                  </div>
                  <div className="fg">
                    <label className="fl">観察日 *</label>
                    <input className="fi" type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/>
                  </div>
                </div>
                <div className="fg">
                  <label className="fl">記入者名 *</label>
                  <input className="fi" placeholder="例：とむ" value={form.author} onChange={e=>setForm({...form,author:e.target.value})}/>
                </div>
                <div className="fg">
                  <label className="fl">都道府県 *</label>
                  <select className="fs" value={form.prefecture} onChange={e=>setForm({...form,prefecture:e.target.value})}>
                    <option value="">選択してください</option>
                    {PREFECTURES.map(p=><option key={p} value={p}>{p}</option>)}
                  </select>
                </div>
                <div className="fg">
                  <label className="fl">観察環境 *</label>
                  <select className="fs" value={form.environment} onChange={e=>setForm({...form,environment:e.target.value})}>
                    <option value="">選択してください</option>
                    {ENVIRONMENTS.map(e=><option key={e} value={e}>{e}</option>)}
                  </select>
                </div>
                <div className="fg">
                  <label className="fl">観察メモ（任意）</label>
                  <textarea className="ft" placeholder="特徴、行動、気づいたことなど…" value={form.memo} onChange={e=>setForm({...form,memo:e.target.value})}/>
                </div>
                <div className="fg">
                  <label className="fl">写真（最大5枚）</label>
                  <input ref={fileInputRef} type="file" accept="image/*" multiple style={{display:"none"}} onChange={e=>handleFiles(e.target.files)}/>
                  <div className={`photo-drop${dragging?" drag-over":""}`}
                    onClick={()=>fileInputRef.current?.click()}
                    onDragOver={e=>{e.preventDefault();setDragging(true);}}
                    onDragLeave={()=>setDragging(false)}
                    onDrop={e=>{e.preventDefault();setDragging(false);handleFiles(e.dataTransfer.files);}}>
                    <div className="photo-drop-icon">📷</div>
                    <div className="photo-drop-text">タップして写真を選ぶ</div>
                    <div className="photo-drop-sub">またはドラッグ＆ドロップ · JPEG/PNG</div>
                  </div>
                  {uploading && <div className="uploading-msg">画像を処理中…</div>}
                  {photos.length>0 && (
                    <div className="photo-previews">
                      {photos.map((p,i)=>(
                        <div key={i} className="photo-preview-wrap">
                          <img className="photo-preview-img" src={p.dataUrl} alt={p.name}/>
                          <button className="photo-remove" onClick={()=>setPhotos(prev=>prev.filter((_,j)=>j!==i))}>×</button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
                <button className="sub-btn" onClick={handleSubmit} disabled={uploading||saving}>
                  {saving ? "保存中…" : editingObs ? "更新する" : "記録を追加する"}
                </button>
                <button className="can-btn" onClick={()=>{setShowForm(false);setPhotos([]);setEditingObs(null);}}>キャンセル</button>
              </>
            )}
          </div>
        </div>
      )}

      {lightbox && (
        <div className="lb-overlay" onClick={()=>setLightbox(null)}>
          <button className="lb-close" onClick={()=>setLightbox(null)}>×</button>
          {(() => {
            const p = lightbox.allPhotos[lightbox.index];
            const src = typeof p==="object" ? (p.original || p.thumb) : p;
            const exif = typeof p==="object" ? p.exif : null;
            return (
              <>
                <img className="lb-img" src={src} alt="観察写真" onClick={e=>e.stopPropagation()}/>
                {exif && (
                  <div className="lb-exif" onClick={e=>e.stopPropagation()}>
                    {(exif.camera || exif.lens) && (
                      <div className="lb-exif-row">
                        {exif.camera && <span style={{display:"flex",alignItems:"center",gap:"4px"}}><IcCamera size={12} stroke="#C8E0B8"/>{exif.camera}</span>}
                        {exif.lens   && <span style={{display:"flex",alignItems:"center",gap:"4px"}}><IcLens size={12} stroke="#C8E0B8"/>{exif.lens}</span>}
                      </div>
                    )}
                    <div className="lb-exif-row" style={{marginTop:"4px"}}>
                      {exif.f        && <span>絞り：{exif.f}</span>}
                      {exif.ss       && <span>SS：{exif.ss}</span>}
                      {exif.iso      && <span>{exif.iso}</span>}
                      {exif.ev       && <span>露出補正：{exif.ev}</span>}
                      {exif.fl       && <span>焦点距離：{exif.fl}</span>}
                      {exif.shotTime && <span>撮影時刻：{exif.shotTime}</span>}
                    </div>
                  </div>
                )}
                <div className="lb-meta" onClick={e=>e.stopPropagation()}>
                  <span style={{display:"inline-flex",alignItems:"center",gap:"3px",marginRight:"10px"}}><IcPin size={11} stroke="#C8BC9E"/>{lightbox.obs.location}</span>
                  <span style={{display:"inline-flex",alignItems:"center",gap:"3px"}}><IcCal size={11} stroke="#C8BC9E" fill="none"/>{lightbox.obs.date}</span>
                  {lightbox.obs.memo && <><br/>{lightbox.obs.memo}</>}
                </div>
              </>
            );
          })()}
          {lightbox.allPhotos.length>1 && (
            <>
              <div className="lb-nav" onClick={e=>e.stopPropagation()}>
                <button className="lb-nav-btn" disabled={lightbox.index===0} onClick={()=>setLightbox(l=>({...l,index:l.index-1}))}>← 前</button>
                <button className="lb-nav-btn" disabled={lightbox.index===lightbox.allPhotos.length-1} onClick={()=>setLightbox(l=>({...l,index:l.index+1}))}>次 →</button>
              </div>
              <div className="lb-counter" onClick={e=>e.stopPropagation()}>{lightbox.index+1} / {lightbox.allPhotos.length}</div>
            </>
          )}
        </div>
      )}
      {/* 管理者ログインモーダル */}
      {showAdminLogin && (
        <div className="admin-modal" onClick={e=>{ if(e.target.className==="admin-modal"){setShowAdminLogin(false);setAdminPwInput("");setAdminPwError(false);} }}>
          <div className="admin-modal-box">
            <div className="admin-modal-title">🔑 管理者ログイン</div>
            <div className="admin-modal-sub">管理者パスワードを入力してください</div>
            <input className="admin-pw-input" type="password" placeholder="パスワード" value={adminPwInput}
              onChange={e=>{ setAdminPwInput(e.target.value); setAdminPwError(false); }}
              onKeyDown={e=>{ if(e.key==="Enter") handleAdminLogin(); }} />
            {adminPwError && <div className="admin-pw-error">パスワードが正しくありません</div>}
            <button className="admin-login-btn" onClick={handleAdminLogin}>ログイン</button>
            <button className="admin-cancel-btn" onClick={()=>{ setShowAdminLogin(false); setAdminPwInput(""); setAdminPwError(false); }}>キャンセル</button>
          </div>
        </div>
      )}

      {/* 月次パスワード変更モーダル */}
      {showPwChange && (
        <div className="admin-modal" onClick={e=>{ if(e.target.className==="admin-modal"){setShowPwChange(false);setNewPwInput("");setPwChangeMsg("");} }}>
          <div className="admin-modal-box">
            <div className="admin-modal-title">🔄 アクセスパスワード変更</div>
            <div className="admin-modal-sub">現在のパスワード：<strong>{accessPw}</strong></div>
            <input className="admin-pw-input" type="text" placeholder="新しいパスワード" value={newPwInput}
              onChange={e=>setNewPwInput(e.target.value)}
              onKeyDown={e=>{ if(e.key==="Enter") handlePwChange(); }} />
            {pwChangeMsg && <div style={{fontSize:"12px",color:"#4A6B3C",marginBottom:"8px"}}>{pwChangeMsg}</div>}
            <button className="admin-login-btn" onClick={handlePwChange}>変更する</button>
            <button className="admin-cancel-btn" onClick={()=>{ setShowPwChange(false); setNewPwInput(""); setPwChangeMsg(""); }}>キャンセル</button>
          </div>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
